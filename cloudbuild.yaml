# Pipeline Tokoku (deploy ke VM Compute Engine). Dijalankan oleh trigger GitHub (push ke main).
# Variabel diatur di trigger: _SUPABASE_URL, _SUPABASE_ANON_KEY (nilai publik).
substitutions:
  _REGION: us-central1
  _ZONE: us-central1-a
  _VM_NAME: tokoku-vm
  _REPO: tokoku
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/database-url/versions/latest
      env: DATABASE_URL

steps:
  # 1. Install dependensi dan cek tipe
  - id: check
    name: node:22-alpine
    entrypoint: sh
    args: ['-c', 'npm ci && npm run typecheck']

  # 2. Build image Docker
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - .

  # 3. Push image ke Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA']

  # 4. Migrasi skema Drizzle (pipeline berhenti jika gagal)
  - id: migrate
    name: node:22-alpine
    entrypoint: sh
    secretEnv: [DATABASE_URL]
    args: ['-c', 'npm ci && npx drizzle-kit migrate']

  # 5. Deploy: beri tahu VM tag image baru lewat metadata.
  #    Skrip tokoku-deploy di VM (cek tiap 30 detik) menarik image dan menjalankan ulang container.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - compute
      - instances
      - add-metadata
      - ${_VM_NAME}
      - --zone=${_ZONE}
      - --metadata=image-tag=$SHORT_SHA

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
