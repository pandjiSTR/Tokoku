# Pipeline Tokoku. Dijalankan oleh trigger GitHub (push ke main).
# Variabel _REGION, _SERVICE, _REPO, _SUPABASE_URL, _SUPABASE_ANON_KEY diatur di trigger.
substitutions:
  _REGION: us-central1
  _SERVICE: tokoku
  _REPO: tokoku
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/database-url/versions/latest
      env: DATABASE_URL

steps:
  # 1. Install dependensi dan cek tipe (lint dan tes ditambahkan di M1)
  - id: check
    name: node:22-alpine
    entrypoint: sh
    args: ['-c', 'npm ci && npm run typecheck']

  # 2. Build image Docker
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - .

  # 3. Push image ke Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA']

  # 4. Migrasi skema Drizzle (pipeline berhenti jika gagal)
  - id: migrate
    name: node:22-alpine
    entrypoint: sh
    secretEnv: [DATABASE_URL]
    args: ['-c', 'npm ci && npx drizzle-kit migrate']

  # 5. Deploy revision baru ke Cloud Run
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=2
      - --memory=512Mi
      - --service-account=tokoku-run@$PROJECT_ID.iam.gserviceaccount.com
      - --set-secrets=DATABASE_URL=database-url:latest
      - --set-env-vars=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
